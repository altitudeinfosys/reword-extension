<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reword Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Reword Settings</h1>
    <p class="subtitle">Configure your AI provider and preferences.</p>

    <div class="field">
      <label for="provider">AI Provider</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="gemini">Gemini</option>
        <option value="openrouter">OpenRouter</option>
      </select>
    </div>

    <div class="field">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your API key" autocomplete="off">
    </div>

    <div class="field">
      <label for="model">Model</label>
      <select id="model">
        <option value="">Loading models...</option>
      </select>
      <span class="hint" id="modelHint"></span>
    </div>

    <div class="field">
      <label for="defaultMode">Default Mode</label>
      <select id="defaultMode">
        <option value="polish">Polish</option>
        <option value="formalize">Formalize</option>
        <option value="shortify">Shortify</option>
        <option value="elaborate">Elaborate</option>
      </select>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn primary">Save</button>
      <button id="testBtn" class="btn secondary">Test Connection</button>
    </div>

    <div id="status" class="status" hidden></div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
